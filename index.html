<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cogie0806 typing</title>
    <link rel="icon" href="アイコン.png" type="image/png">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
        #word-kanji {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            min-height: 42px;
        }
        #word-roma {
            font-size: 22px;
            letter-spacing: 2px;
            color: #95a5a6;
            margin-bottom: 30px;
            min-height: 33px;
        }
        .typed {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            font-weight: bold;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-warning { background-color: #f1c40f; color: #333; }
        .btn-warning:hover { background-color: #d4ac0d; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-success:hover { background-color: #27ae60; }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-title {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .result-item {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
        .hidden {
            display: none !important;
        }
        #pause-overlay {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            margin: 40px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>cogie0806 typing</h1>
    
    <!-- 難易度選択画面 -->
    <div id="difficulty-screen">
        <p style="margin-bottom: 20px; color: #555; font-weight: bold;">難易度を選んでね</p>
        <div class="btn-group" style="flex-direction: column;">
            <button id="easy-btn" class="btn-success">かんたん (短い言葉)</button>
            <button id="normal-btn" class="btn-warning">ふつう (普通の文章)</button>
            <button id="hard-btn" class="btn-danger">むずかしい (少し長い文章)</button>
        </div>
    </div>

    <!-- プレイ中の情報表示 -->
    <div id="info-panel" class="info-panel hidden">
        <div>進捗: <span id="progress">0</span> / 15</div>
        <div>経過時間: <span id="timer">0.0</span>秒</div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-fields" class="hidden">
        <div id="word-kanji"></div>
        <div id="word-roma"></div>
    </div>

    <!-- 一時停止中の表示 -->
    <div id="pause-overlay" class="hidden">一時停止中</div>

    <!-- 結果発表画面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title">🎉 ゲームクリア！結果発表</div>
        <div class="result-item">タイプ速度: <span id="res-speed">0</span> 文字/秒</div>
        <div class="result-item">正解率: <span id="res-accuracy">0</span> %</div>
        <div class="result-item">誤タイプ数: <span id="res-miss">0</span> 回</div>
    </div>

    <!-- コントロールボタン -->
    <div class="btn-group">
        <button id="pause-btn" class="btn-warning hidden">一時停止</button>
        <button id="resume-btn" class="btn-primary hidden">再開</button>
        <button id="restart-btn" class="btn-danger hidden">最初から</button>
        <button id="retry-btn" class="btn-primary hidden">難易度選びに戻る</button>
    </div>
</div>
<script>
    const questionsByDifficulty = {
        easy: [
            { kanji: 'いぬ', roma: 'inu' },
            { kanji: 'ねこ', roma: 'neko' },
            { kanji: 'とり', roma: 'tori' },
            { kanji: 'さかな', roma: 'sakana' },
            { kanji: 'りんご', roma: 'ringo' },
            { kanji: 'みかん', roma: 'mikan' },
            { kanji: 'そら', roma: 'sora' },
            { kanji: 'うみ', roma: 'umi' },
            { kanji: 'やま', roma: 'yama' },
            { kanji: 'はな', roma: 'hana' },
            { kanji: 'くるま', roma: 'kuruma' },
            { kanji: 'でんしゃ', roma: 'densha' },
            { kanji: '1年生', roma: '1nensei' },
            { kanji: '本を読む', roma: 'honwoyomu' },
            { kanji: 'あそぶ', roma: 'asobu' },
            { kanji: 'はしる', roma: 'hashiru' },
            { kanji: 'ジャンプ', roma: 'jyanpu' }
        ],
        normal: [
            { kanji: 'あおいそら', roma: 'aoisora' },
            { kanji: 'おいしいごはん', roma: 'oishiigohan' },
            { kanji: 'たのしいゲーム', roma: 'tanoshiige-mu' },
            { kanji: 'あかるいみらい', roma: 'akaraimirai' },
            { kanji: 'しずかなよる', roma: 'shizukanayoru' },
            { kanji: 'うみのいえ', roma: 'uminoie' },
            { kanji: 'さくらのき', roma: 'sakuranoki' },
            { kanji: 'みどりのもり', roma: 'midorinomori' },
            { kanji: 'あきのかぜ', roma: 'akinokaze' },
            { kanji: 'ふゆのゆき', roma: 'fuyunoyuki' },
            { kanji: 'いぬのおんがえし', roma: 'inunongaeshi' },
            { kanji: 'ねこのひるね', roma: 'nekonohirune' },
            { kanji: 'あめのひのさんぽ', roma: 'amenohinosanpo' },
            { kanji: 'ほしぞらを見上げる', roma: 'hoshizorawomiageru' },
            { kanji: 'はしるのがすき', roma: 'hashirunogasuki' },
            { kanji: 'おんがくをきく', roma: 'ongakuwokiku' },
            { kanji: 'ほんをよむ時間', roma: 'honwoyomujikan' }
        ],
        hard: [
            { kanji: 'プログラミングをがんばる', roma: 'puroguraminguwoganbaru' },
            { kanji: 'しょうがっこうのともだち', roma: 'shougakkounotomodachi' },
            { kanji: 'きょうもいちにちがんばろう', roma: 'kyoumouichinichiganbarou' },
            { kanji: 'じぶんを信じてつきすすむ', roma: 'jibunwosinjitetukisusumu' },
            { kanji: 'パソコンのキーボード操作', roma: 'pasokonnoki-bo-dousa' },
            { kanji: 'たくさんの本を読んで賢くなる', roma: 'takasanhonwoyondekashikokunaru' },
            { kanji: 'みらいの科学技術を発展させる', roma: 'mirainokagakugijutsuwohattensaseru' },
            { kanji: 'すばらしい景色をカメラで撮影する', roma: 'subarashiikeshikiwokameradesatsueisuru' },
            { kanji: 'こころをこめてピアノをひく', roma: 'kokorowokometepianowohiku' },
            { kanji: 'てんきがよくておそとでサッカー', roma: 'tenkigayokuteosotodesakka-' },
            { kanji: 'えがおをわすれずにていねいに', roma: 'egaowowasurezuniteineini' },
            { kanji: 'みんなでちからをあわせてお祭り', roma: 'minnadechikaroawaseteomatsuri' },
            { kanji: 'あたらしいちょうせんをつづける', roma: 'atarashiichousenwotsuzukeru' },
            { kanji: 'たのしいおもいでをたくさんはなす', roma: 'tanoshiioomoiwotakusahanasu' },
            { kanji: 'ゆめをかなえるためにどりょくする', roma: 'yumewokanaerutamenidoryokusuru' },
            { kanji: 'ちきゅうのきれいなみどりをまもる', roma: 'chikyuunokireinamidoriwomamoru' },
            { kanji: 'りょうりを手伝って家族をよろこばす', roma: 'ryouriwoutetadatekazokuworokobasu' }
        ]
    };

    let currentQuestions = [];
    let questionIndex = 0;
    let charIndex = 0;
    let selectedDifficulty = 'normal';
    
    let totalKeysPressed = 0;
    let correctKeysPressed = 0;
    let missCount = 0;
    let startTime = 0;
    let elapsedTime = 0;
    
    let gameState = 'DIFFICULTY';
    let timerInterval;

    const difficultyScreen = document.getElementById('difficulty-screen');
    const infoPanel = document.getElementById('info-panel');
    const gameFields = document.getElementById('game-fields');
    const pauseOverlay = document.getElementById('pause-overlay');
    const resultScreen = document.getElementById('result-screen');
    
    const progressDisplay = document.getElementById('progress');
    const timerDisplay = document.getElementById('timer');
    const kanjiDisplay = document.getElementById('word-kanji');
    const romaDisplay = document.getElementById('word-roma');
    
    const easyBtn = document.getElementById('easy-btn');
    const normalBtn = document.getElementById('normal-btn');
    const hardBtn = document.getElementById('hard-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');
    const retryBtn = document.getElementById('retry-btn');

    function initQuestions(difficulty) {
        const list = questionsByDifficulty[difficulty];
        const shuffled = [...list].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 15);
    }

    function startGame(difficulty) {
        selectedDifficulty = difficulty;
        initQuestions(difficulty);
        questionIndex = 0;
        charIndex = 0;
        totalKeysPressed = 0;
        correctKeysPressed = 0;
        missCount = 0;
        elapsedTime = 0;
        
        gameState = 'PLAYING';
        updateUI();
        nextQuestion();
        startTimer();
    }

    function startTimer() {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
            elapsedTime = Date.now() - startTime;
            timerDisplay.textContent = (elapsedTime / 1000).toFixed(1);
        }, 100);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function nextQuestion() {
        if (questionIndex >= 15) {
            endGame();
            return;
        }
        charIndex = 0;
        progressDisplay.textContent = questionIndex + 1;
        kanjiDisplay.textContent = currentQuestions[questionIndex].kanji;
        renderRoma();
    }

    function renderRoma() {
        const currentWord = currentQuestions[questionIndex].roma;
        const typedPart = `<span class="typed">${currentWord.substring(0, charIndex)}</span>`;
        const untypedPart = currentWord.substring(charIndex);
        romaDisplay.innerHTML = typedPart + untypedPart;
    }

    window.addEventListener('keydown', (e) => {
        if (gameState !== 'PLAYING') return;
        if (e.key.length > 1) return;

        totalKeysPressed++;
        const currentWord = currentQuestions[questionIndex].roma;

        if (e.key === currentWord[charIndex]) {
            correctKeysPressed++;
            charIndex++;
            renderRoma();

            if (charIndex === currentWord.length) {
                questionIndex++;
                nextQuestion();
            }
        } else {
            missCount++;
        }
    });

    function pauseGame() {
        if (gameState !== 'PLAYING') return;
        gameState = 'PAUSED';
        stopTimer();
        updateUI();
    }

    function resumeGame() {
        if (gameState !== 'PAUSED') return;
        gameState = 'PLAYING';
        startTimer();
        updateUI();
    }

    function restartGame() {
        stopTimer();
        startGame(selectedDifficulty);
    }

    function endGame() {
        stopTimer();
        gameState = 'FINISHED';
        updateUI();

        const finalTimeSec = elapsedTime / 1000;
        const speed = finalTimeSec > 0 ? (correctKeysPressed / finalTimeSec).toFixed(2) : 0;
        const accuracy = totalKeysPressed > 0 ? ((correctKeysPressed / totalKeysPressed) * 100).toFixed(1) : 0;

        document.getElementById('res-speed').textContent = speed;
        document.getElementById('res-accuracy').textContent = accuracy;
        document.getElementById('res-miss').textContent = missCount;
    }

    function updateUI() {
        difficultyScreen.classList.add('hidden');
        infoPanel.classList.add('hidden');
        gameFields.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        resultScreen.classList.add('hidden');
        
        pauseBtn.classList.add('hidden');
        resumeBtn.classList.add('hidden');
        restartBtn.classList.add('hidden');
        retryBtn.classList.add('hidden');

        if (gameState === 'DIFFICULTY') {
            difficultyScreen.classList.remove('hidden');
        } 
        else if (gameState === 'PLAYING') {
            infoPanel.classList.remove('hidden');
            gameFields.classList.remove('hidden');
            pauseBtn.classList.remove('hidden');
            restartBtn.classList.remove('hidden');
        } 
        else if (gameState === 'PAUSED') {
            infoPanel.classList.remove('hidden');
            pauseOverlay.classList.remove('hidden');
            resumeBtn.classList.remove('hidden');
            restartBtn.classList.remove('hidden');
        } 
        else if (gameState === 'FINISHED') {
            resultScreen.classList.remove('hidden');
            retryBtn.classList.remove('hidden');
        }
    }

    easyBtn.addEventListener('click', () => startGame('easy'));
    normalBtn.addEventListener('click', () => startGame('normal'));
    hardBtn.addEventListener('click', () => startGame('hard'));
    pauseBtn.addEventListener('click', pauseGame);
    resumeBtn.addEventListener('click', resumeGame);
    restartBtn.addEventListener('click', restartGame);
    retryBtn.addEventListener('click', () => {
        gameState = 'DIFFICULTY';
        updateUI();
    });

    updateUI();
</script>
</body>
</html>
